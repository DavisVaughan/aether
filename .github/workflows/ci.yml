name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace --profile ci

      # A PR can never land with stale generated code, because regenerating it
      # here must produce no diff. `xtask::reformat()` shells out to `rustfmt`
      # from the `stable` toolchain, which the runner image ships with.
      - name: Codegen is up to date
        run: just codegen && git diff --exit-code

      # Nor with stale snapshot cells, for the same reason
      - name: Snapshots are up to date
        run: cargo run -p xtask -- accept && git diff --exit-code
